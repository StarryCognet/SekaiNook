name: CI

# 目标不是「全绿才算好」，而是「别把明显坏掉的东西推上去」：
#   * 后端 Functions / React 旧版的类型错误
#   * Flutter 的编译错误（analyze 的 info 不拦，warning 也不拦）
#   * 单元测试回归（打真实后端的 live 用例在 dart_test.yaml 里默认跳过）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # wrangler types → tsc --noEmit → vite build，一次校验后端 Functions 与 React 旧版
      - name: 后端与 React 构建
        run: npm run build

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter 依赖
        working-directory: app
        run: flutter pub get

      # flutter analyze 默认把 info 也算失败（fatal-infos），但仓库历史代码里
      # 还有几十条风格类提示（prefer_initializing_formals 之类），一次格式化会
      # 改动上百个文件 —— 所以这里只拦 error：info / warning 打印出来留档，不卡 CI。
      - name: 静态检查
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: 单元测试（跳过 live）
        working-directory: app
        run: flutter test --no-pub

      # ---- 发布一致性三闸（报告 §9.4）：任何一闸红都说明「这次发出去会和另一端不一致」 ----
      # ① 版本日志兜底文件必须与 src/config/changelog.ts 同步（两端共用一份日志）
      # ② pubspec.yaml 的 version 必须等于 APP_VERSION（否则 APK 版本号与日志对不上）
      - name: 版本一致性与版本日志
        run: |
          npm run changelog:fallback:check
          npm run release:check -- --offline

      # ③ 网页版必须能构建（含 version.json 的 built_at 注入）——
      #    挡住「发版命令能跑、但 web:build 已经坏了」的半端发布
      - name: 网页版构建
        run: npm run web:build

# SekaiNook 宿主机 nginx 站点配置
#
# 部署位置：/etc/nginx/sites-available/sekainook
#           sudo ln -sf /etc/nginx/sites-available/sekainook /etc/nginx/sites-enabled/sekainook
#
# 设计原则（很重要，别破坏）：
#   1. 80 端口永远归**系统 nginx** 独占（default_server）。1Panel 的 OpenResty 不要装，
#      装了就会抢走 80，输 IP 变成面板登录页。
#   2. 所有 Docker 容器一律只绑 127.0.0.1:<端口>，绝不直接暴露公网；要公网访问就在这里反代。
#   3. 新增服务要**另开 server 块**（监听别的端口，比如 8080），
#      **不要**往下面这个 server 块里塞 location —— 里面的正则 location 会吞掉请求。
#   4. 需要 WebSocket 的服务，记得带 Upgrade / Connection 头（见文末注释示例）。

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /opt/sekainook/web;
    index index.html;

    # 图片上传走 /api/，默认 1m 太小
    client_max_body_size 50m;

    access_log /var/log/nginx/sekainook.access.log;
    error_log  /var/log/nginx/sekainook.error.log warn;

    # ---------------------------------------------------------------
    # Basic Auth（账号 family / 口令 3398）
    # 口令文件：/etc/nginx/.htpasswd
    # 改口令：sudo htpasswd -B /etc/nginx/.htpasswd family
    # ---------------------------------------------------------------
    auth_basic           "SekaiNook";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # ---------------------------------------------------------------
    # 后端 API 反代（SekaiNook Node 服务，只绑 127.0.0.1:8788）
    # ---------------------------------------------------------------
    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:8788;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式 / SSE 响应友好；普通 JSON 也不受影响
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }

    # ---------------------------------------------------------------
    # 版本号：要实时，不能缓存
    # 用法：curl http://<IP>/version.json
    # ---------------------------------------------------------------
    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # ---------------------------------------------------------------
    # 静态资源长缓存（Flutter Web 产物文件名带内容哈希，可放心 immutable）
    # ---------------------------------------------------------------
    location ~* \.(js|mjs|css|wasm|json|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf)$ {
        # 注意：json 也被长缓存了，但 /version.json 上面单独 no-store，优先级更高（精确匹配 > 正则）
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---------------------------------------------------------------
    # SPA 回退
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------
    # 安全响应头
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff"                   always;
    add_header X-Frame-Options        "SAMEORIGIN"                always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;
}


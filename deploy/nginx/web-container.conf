# ============================================================
# SekaiNook web container (nginx:alpine) - mounted at
#   /etc/nginx/conf.d/default.conf
# Serves /opt/sekainook/web (mounted to /usr/share/nginx/html)
# and proxies /api/ to the backend container.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # ---- backend API ----------------------------------------
    location ^~ /api/ {
        proxy_pass http://sekainook-backend:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- hashed static assets -------------------------------
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- never cache the shell / version file --------------
    location = /version.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ---- SPA fallback ---------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- basic hardening ------------------------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}

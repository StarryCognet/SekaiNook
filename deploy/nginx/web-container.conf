# ============================================================
# SekaiNook + 1Panel 统一入口（宿主机 80 端口）
#
#   http://IP/               → 1Panel 面板        (host.docker.internal:18001)
#   http://IP/sekainook/     → SekaiNook 网页     (静态，/sekainook/ 子路径)
#   http://IP/api/           → SekaiNook 后端     (sekainook-backend:8788)
#   http://IP/api/v1|v2/     → 1Panel 自己的 API  (host.docker.internal:18001)
#
# ⚠️ 为什么 /api/ 必须按前缀拆开：
#   1Panel 前端登录打的是 /api/v2/core/auth/login，也在 /api/ 下面。
#   如果整段 /api/ 都转给 SekaiNook 后端，面板登录会直接 404。
#   nginx 前缀匹配是「最长优先」，所以 /api/v2/ 和 /api/v1/ 写在 /api/ 前面
#   会先命中。1Panel 以后若升到 v3 引入了新的 API 前缀，这里要跟着加。
#
# ⚠️ 为什么 Flutter 必须先构建成 --base-href /sekainook/：
#   Flutter Web 的 index.html 里资源地址由 base-href 决定。默认是 /，
#   在 /sekainook/ 下打开时所有 /assets/*.js 都会 404，页面白屏。
# ============================================================

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ---------- 1Panel API（必须排在 /api/ 之前） ----------
    location ^~ /api/v1/ {
        proxy_pass http://host.docker.internal:18001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location ^~ /api/v2/ {
        proxy_pass http://host.docker.internal:18001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---------- SekaiNook 后端 API ----------
    location ^~ /api/ {
        proxy_pass http://sekainook-backend:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- SekaiNook 前端：带指纹的静态资源，长缓存 ----------
    location ~* ^/sekainook/(.+\.(?:js|css|wasm|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|otf|json))$ {
        alias /usr/share/nginx/html/$1;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- SekaiNook 前端：入口文件绝不缓存 ----------
    location = /sekainook/index.html {
        alias /usr/share/nginx/html/index.html;
        add_header Cache-Control "no-store";
    }

    location = /sekainook/version.json {
        alias /usr/share/nginx/html/version.json;
        add_header Cache-Control "no-store";
    }

    location = /sekainook/flutter_service_worker.js {
        alias /usr/share/nginx/html/flutter_service_worker.js;
        add_header Cache-Control "no-store";
    }

    # ---------- SekaiNook 前端：SPA 兜底 ----------
    location /sekainook/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /sekainook/index.html;
    }

    location = /sekainook {
        return 301 /sekainook/;
    }

    # ---------- 1Panel 面板（根路径，放最后） ----------
    location / {
        proxy_pass http://host.docker.internal:18001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---------- 基础加固 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm image/svg+xml;
    gzip_min_length 1024;
}

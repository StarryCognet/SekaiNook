<!doctype html>
<html lang="zh-CN" data-theme="original">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SekaiNook · 通知方式图鉴</title>
<style>
/* ================= 主题：与 App 的 7 套 AppPalette 一一对应 ================= */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --shadow-1: 0 1px 2px rgba(16,24,40,.05), 0 10px 30px -18px rgba(16,24,40,.25);
  --shadow-2: 0 30px 70px -28px rgba(12,18,35,.45);
}
html[data-theme="original"]{
  --primary:#1A1A2E;--primary-soft:#2A2A4A;--success:#0F9B6C;--danger:#E94560;--warning:#F5A623;
  --bg:#F5F6FA;--surface:#FFFFFF;--surface-soft:#F9FAFB;--text:#1A1A2E;--text-2:#6B7280;--text-3:#727780;
  --border:#E5E7EB;--sider:#1A1A2E;--sider-sel:#2A2A4A;--seg-sel:#FFFFFF;
  --on-primary:#FFFFFF;--on-danger:#FFFFFF;--on-success:#FFFFFF;
}
html[data-theme="midnight"]{
  --primary:#2B7FE0;--primary-soft:#1B4A8F;--success:#34D399;--danger:#FF6B81;--warning:#F7B955;
  --bg:#060C1C;--surface:#0E1A33;--surface-soft:#132241;--text:#E8F1FF;--text-2:#92A8C9;--text-3:#7B8FAE;
  --border:#22355A;--sider:#04091A;--sider-sel:#152A52;--seg-sel:#1D3160;
  --on-primary:#FFFFFF;--on-danger:#FFFFFF;--on-success:#04140D;
}
html[data-theme="sakura"]{
  --primary:#E8628F;--primary-soft:#F6A8C4;--success:#2FAE86;--danger:#E8455F;--warning:#E9A13A;
  --bg:#FFF5F8;--surface:#FFFFFF;--surface-soft:#FDF1F5;--text:#3B2430;--text-2:#8B6B78;--text-3:#847279;
  --border:#F6DBE5;--sider:#E8628F;--sider-sel:#C9426E;--seg-sel:#FFFFFF;
  --on-primary:#FFFFFF;--on-danger:#FFFFFF;--on-success:#FFFFFF;
}
html[data-theme="forest"]{
  --primary:#2F9E6E;--primary-soft:#8FD3B4;--success:#2F9E6E;--danger:#E0603F;--warning:#DFA03A;
  --bg:#F2F9F5;--surface:#FFFFFF;--surface-soft:#EEF7F1;--text:#1E3B2F;--text-2:#5F7D6F;--text-3:#677A70;
  --border:#DCEBE2;--sider:#1F6F4D;--sider-sel:#2F9E6E;--seg-sel:#FFFFFF;
  --on-primary:#FFFFFF;--on-danger:#FFFFFF;--on-success:#FFFFFF;
}
html[data-theme="sunset"]{
  --primary:#E07B39;--primary-soft:#F5B183;--success:#3D9E6D;--danger:#D8452F;--warning:#DD9A2A;
  --bg:#FFF8F1;--surface:#FFFFFF;--surface-soft:#FDF3E9;--text:#3F2A1B;--text-2:#8A6C55;--text-3:#837262;
  --border:#F4E0CC;--sider:#C25F22;--sider-sel:#E07B39;--seg-sel:#FFFFFF;
  --on-primary:#FFFFFF;--on-danger:#FFFFFF;--on-success:#FFFFFF;
}
html[data-theme="crimson"]{
  --primary:#F04A5A;--primary-soft:#8C1F2D;--success:#3DDC97;--danger:#FF7B7B;--warning:#F2B44C;
  --bg:#140609;--surface:#1F0C11;--surface-soft:#2A1218;--text:#F8ECEF;--text-2:#C99AA5;--text-3:#A67E86;
  --border:#3D2027;--sider:#0D0406;--sider-sel:#3A1620;--seg-sel:#3A1620;
  --on-primary:#FFFFFF;--on-danger:#2A0508;--on-success:#04140D;
}
html[data-theme="graphite"]{
  --primary:#0F77F0;--primary-soft:#0A4F9E;--success:#3DDC97;--danger:#FF4538;--warning:#FFDD55;
  --bg:#141414;--surface:#1F1F1F;--surface-soft:#242424;--text:#FFFFFF;--text-2:#B4B4B4;--text-3:#8D8D8D;
  --border:#383838;--sider:#0D0D0D;--sider-sel:#2A2A2A;--seg-sel:#3F3F3F;
  --on-primary:#FFFFFF;--on-danger:#FFFFFF;--on-success:#04140D;
}
html[data-dark="1"]{
  --snack-bg:#2B2B2B;
}
html[data-dark="0"]{
  --snack-bg:#303030;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background-color .28s ease,color .28s ease;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:650}
::selection{background:color-mix(in srgb,var(--primary) 28%,transparent)}
.mono{font-variant-numeric:tabular-nums}

/* ================= 顶栏 ================= */
.topbar{
  position:sticky;top:0;z-index:80;
  display:flex;align-items:center;gap:18px;
  padding:11px 24px;
  background:var(--surface);
  background:color-mix(in srgb,var(--surface) 84%,transparent);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:32px;height:32px;border-radius:10px;flex:none;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));
  color:var(--on-primary);display:grid;place-items:center;font-weight:800;font-size:15px;
  box-shadow:0 6px 14px -6px color-mix(in srgb,var(--primary) 60%,transparent);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.2}
.brand-txt b{font-size:14px;letter-spacing:-.01em}
.brand-txt span{font-size:10.5px;color:var(--text-3);letter-spacing:.02em}
.views{display:flex;gap:3px;background:var(--surface-soft);border:1px solid var(--border);border-radius:999px;padding:3px}
.views button{
  display:flex;align-items:center;gap:6px;
  padding:7px 15px;border-radius:999px;font-size:13px;color:var(--text-2);
  transition:background-color .16s,color .16s;
}
.views button:hover{color:var(--text)}
.views button.on{background:var(--surface);color:var(--text);font-weight:650;box-shadow:var(--shadow-1)}
.views em{
  font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--danger);color:var(--on-danger);display:grid;place-items:center;
}
.themes{margin-left:auto;display:flex;align-items:center;gap:7px}
.theme-dot{
  width:22px;height:22px;border-radius:50%;flex:none;
  background:conic-gradient(var(--c1) 0 38%,var(--c2) 0 68%,var(--c3) 0);
  border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border);
  transition:transform .18s,box-shadow .18s;
}
.theme-dot:hover{transform:scale(1.12)}
.theme-dot.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary);transform:scale(1.1)}
.theme-name{font-size:11px;color:var(--text-3);min-width:52px;text-align:right}

/* ================= 布局 ================= */
.layout{
  display:grid;grid-template-columns:264px minmax(420px,1fr) 336px;gap:24px;
  max-width:1440px;margin:0 auto;padding:20px 24px 130px;align-items:start;
}
.hero{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:8px 2px 4px}
.hero h1{font-size:24px;letter-spacing:-.02em;line-height:1.25}
.hero p{font-size:12.5px;color:var(--text-3);margin-top:6px;max-width:640px}
.hero-stat{display:flex;gap:8px;flex:none}
.hero-stat div{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:7px 12px;text-align:center;box-shadow:var(--shadow-1);
}
.hero-stat b{display:block;font-size:17px;line-height:1.3;font-variant-numeric:tabular-nums}
.hero-stat span{font-size:10px;color:var(--text-3)}

/* ================= 左侧清单 ================= */
.rail{
  position:sticky;top:72px;display:flex;flex-direction:column;gap:2px;
  max-height:calc(100vh - 96px);overflow-y:auto;padding-right:4px;scrollbar-width:thin;
}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.rail-group{
  display:flex;align-items:center;gap:7px;
  font-size:10px;font-weight:750;letter-spacing:.13em;color:var(--text-3);
  padding:15px 10px 7px;text-transform:uppercase;
}
.rail-group i{width:5px;height:5px;border-radius:50%;background:var(--primary);opacity:.8}
.rail-item{
  display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  padding:9px 10px;border-radius:12px;border:1px solid transparent;
  transition:background-color .14s,border-color .14s,box-shadow .14s;
}
.rail-item:hover{background:var(--surface-soft)}
.rail-item.on{background:var(--surface);border-color:var(--border);box-shadow:var(--shadow-1)}
.rail-num{
  flex:none;width:22px;height:22px;margin-top:1px;border-radius:7px;
  background:var(--surface-soft);border:1px solid var(--border);
  color:var(--text-3);font-size:10.5px;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums;
}
.rail-item.on .rail-num{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.rail-name{font-size:13px;font-weight:600;line-height:1.35;letter-spacing:-.005em}
.rail-desc{font-size:11px;color:var(--text-3);line-height:1.45;margin-top:2px}
.rail-pick{margin-left:auto;flex:none;color:var(--success);margin-top:3px;opacity:0;transform:scale(.5);transition:.18s}
.rail-item.picked .rail-pick{opacity:1;transform:none}

/* ================= 中间舞台 ================= */
.stage{display:flex;flex-direction:column;align-items:center;min-width:0}
.stage-head{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.kicker{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10px;font-weight:750;letter-spacing:.12em;color:var(--primary);
}
.kicker:before{content:"";width:14px;height:2px;border-radius:2px;background:var(--primary)}
.stage-head h1{font-size:20px;letter-spacing:-.02em;line-height:1.3;margin-top:3px}
.stage-actions{display:flex;gap:7px;flex:none}
.icon-btn{
  display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;
  border-radius:10px;background:var(--surface);border:1px solid var(--border);
  font-size:12px;color:var(--text-2);box-shadow:var(--shadow-1);transition:.15s;
}
.icon-btn:hover{color:var(--text);border-color:color-mix(in srgb,var(--primary) 35%,var(--border))}
.icon-btn svg{flex:none}
.stage-body{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.hint{
  margin-top:2px;font-size:11px;color:var(--text-3);
  display:flex;align-items:center;gap:6px;text-align:center;max-width:420px;
}

/* ================= 手机壳 ================= */
.phone{
  position:relative;flex:none;
  width:min(366px,calc(100vw - 48px));
  aspect-ratio:366/744;
  padding:9px;border-radius:52px;
  background:linear-gradient(150deg,#43434e 0%,#101014 42%,#2a2a33 100%);
  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.35),
    inset 0 -1px 2px rgba(0,0,0,.6),
    0 0 0 1px rgba(0,0,0,.55),
    0 40px 80px -32px rgba(10,14,28,.55);
  isolation:isolate;
}
/* 视口不够高时按比例收手机，保证手机底栏不顶到选择条 */
@media (min-width:761px) and (max-height:1150px){.phone{width:min(340px,calc(100vw - 48px))}}
@media (min-width:761px) and (max-height:1000px){.phone{width:min(312px,calc(100vw - 48px))}}
@media (min-width:761px) and (max-height:900px){.phone{width:min(280px,calc(100vw - 48px))}}
@media (min-width:761px) and (max-height:800px){.phone{width:min(240px,calc(100vw - 48px))}}
.phone.shake{animation:phone-shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes phone-shake{
  10%,90%{transform:translateX(-3px) rotate(-.25deg)}
  20%,80%{transform:translateX(4px) rotate(.3deg)}
  30%,50%,70%{transform:translateX(-5px) rotate(-.3deg)}
  40%,60%{transform:translateX(5px) rotate(.3deg)}
}
.phone-screen{
  position:relative;width:100%;height:100%;overflow:hidden;border-radius:44px;
  background:var(--bg);color:var(--text);
  transition:background-color .28s ease;
}
.island{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  width:90px;height:26px;border-radius:999px;background:#050507;z-index:41;
}
.statusbar{
  position:absolute;inset:0 0 auto 0;height:44px;z-index:30;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:12px;font-weight:650;letter-spacing:.01em;
  pointer-events:none;color:var(--text);
}
.statusbar.hidden{opacity:0}
.sb-right{display:flex;align-items:center;gap:5px}
.sb-right svg{opacity:.92}
.screen{
  position:absolute;inset:44px 0 0 0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:none;overscroll-behavior:contain;
}
.screen::-webkit-scrollbar{display:none}
.homebar{
  position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:124px;height:5px;border-radius:3px;background:var(--text);opacity:.28;z-index:45;
}

/* ================= 手机内：通用 App 组件 ================= */
.s-page{padding:10px 16px 96px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.s-home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:2px 1px 2px}
.s-hi{font-size:20px;font-weight:750;letter-spacing:-.025em;line-height:1.25}
.s-sub{font-size:11px;color:var(--text-3);margin-top:4px}
.s-bell{
  position:relative;flex:none;width:38px;height:38px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--text-2);box-shadow:var(--shadow-1);
}
.s-count{
  position:absolute;top:-5px;right:-6px;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;background:var(--danger);color:var(--on-danger);
  font-size:10px;font-weight:750;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface);font-variant-numeric:tabular-nums;
}
.s-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:14px;box-shadow:var(--shadow-1);
}
.s-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.s-label{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.s-pill{
  font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;
  color:var(--primary);background:var(--surface-soft);
  background:color-mix(in srgb,var(--primary) 12%,transparent);
}
.s-progress{height:7px;border-radius:999px;background:var(--surface-soft);margin:11px 0 8px;overflow:hidden}
.s-progress i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--success));transition:width .5s}
.s-muted{font-size:11px;color:var(--text-3);line-height:1.5}
.s-section{font-size:11px;font-weight:750;letter-spacing:.1em;color:var(--text-3);padding:4px 2px 0;text-transform:uppercase}
.s-msg{display:flex;gap:11px;align-items:flex-start}
.s-msg-ic{
  flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary);
}
.s-msg-t{font-size:13px;font-weight:650;line-height:1.35}
.s-msg-b{font-size:11.5px;color:var(--text-2);line-height:1.5;margin-top:3px}
.s-msg-time{font-size:10px;color:var(--text-3);margin-top:5px}
.s-task{display:flex;align-items:center;gap:10px;padding:11px 12px}
.s-check{
  flex:none;width:22px;height:22px;border-radius:7px;border:1.6px solid var(--border);
  display:grid;place-items:center;color:transparent;
}
.s-task.done .s-check{background:var(--success);border-color:var(--success);color:var(--on-success)}
.s-task.done .s-task-name{color:var(--text-3);text-decoration:line-through}
.s-task-name{font-size:12.5px;font-weight:600}
.s-task-meta{font-size:10.5px;color:var(--text-3);margin-top:2px}
.s-tagline{font-size:10.5px;color:var(--text-3);margin-top:auto;padding:6px 2px 0;text-align:center}

/* 底部胶囊导航 */
.s-nav{
  position:absolute;left:13px;right:13px;bottom:22px;z-index:20;
  height:62px;border-radius:999px;display:flex;align-items:center;justify-content:space-around;
  background:color-mix(in srgb,var(--surface) 90%,transparent);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--border);box-shadow:var(--shadow-1);padding:0 5px;
}
.s-nav-item{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:9.5px;color:var(--text-3);padding:7px 11px;border-radius:14px;transition:.15s;
}
.s-nav-item.on{color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent);font-weight:700}
.s-badge{
  position:absolute;top:1px;right:1px;min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--danger);color:var(--on-danger);
  font-size:9.5px;font-weight:750;display:grid;place-items:center;
  box-shadow:0 0 0 2px var(--surface);font-variant-numeric:tabular-nums;
}
.s-badge.dot{min-width:8px;width:8px;height:8px;padding:0;top:6px;right:9px}
.s-nav-item.on .s-badge{box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 10%,var(--surface))}

/* 脉冲点 */
.pulse{position:relative;width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.pulse:after{
  content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1.5px solid var(--danger);animation:pulse 1.7s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.55);opacity:.95}75%{transform:scale(1.55);opacity:0}100%{opacity:0}}
.pulse.primary{background:var(--primary)}
.pulse.primary:after{border-color:var(--primary)}
.pulse.warn{background:var(--warning)}
.pulse.warn:after{border-color:var(--warning)}

/* ================= 系统通知栏（下拉面板） ================= */
.notif-panel{
  position:absolute;inset:0;z-index:29;padding:48px 12px 16px;
  display:flex;flex-direction:column;gap:9px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:blur(28px) saturate(1.25);backdrop-filter:blur(28px) saturate(1.25);
  animation:panel-in .42s cubic-bezier(.22,.9,.28,1);
}
@keyframes panel-in{from{transform:translateY(-103%)}to{transform:translateY(0)}}
.panel-handle{width:38px;height:4px;border-radius:3px;background:var(--text-3);opacity:.4;margin:0 auto 2px}
.panel-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:2px 4px 2px;font-size:11.5px;color:var(--text-2);
}
.panel-title b{font-size:15px;color:var(--text);letter-spacing:-.01em}
.panel-title button{font-size:11px;color:var(--primary);font-weight:650}
.pn-card{
  display:flex;gap:11px;align-items:flex-start;
  padding:12px 13px;border-radius:22px;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  border:1px solid color-mix(in srgb,var(--border) 75%,transparent);
  box-shadow:0 14px 30px -16px rgba(0,0,0,.35);
  animation:card-drop .45s cubic-bezier(.2,.9,.28,1) both;
}
.pn-card:nth-child(2){animation-delay:.05s}
.pn-card:nth-child(3){animation-delay:.1s}
@keyframes card-drop{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
.pn-app{
  flex:none;width:34px;height:34px;border-radius:10px;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));
  color:var(--on-primary);display:grid;place-items:center;
  box-shadow:0 5px 12px -5px color-mix(in srgb,var(--primary) 70%,transparent);
}
.pn-main{min-width:0;flex:1}
.pn-top{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text-3)}
.pn-top b{font-size:10.5px;color:var(--text-2);font-weight:650}
.pn-title{font-size:12.5px;font-weight:700;line-height:1.35;margin-top:3px;letter-spacing:-.01em}
.pn-body{font-size:11px;color:var(--text-2);line-height:1.5;margin-top:2px;white-space:pre-line}
.pn-actions{display:flex;gap:6px;margin-top:9px}
.pn-actions button{
  font-size:10.5px;font-weight:650;padding:5px 10px;border-radius:9px;
  background:color-mix(in srgb,var(--primary) 10%,transparent);color:var(--primary);
}
.pn-close{color:var(--text-3);flex:none;margin-top:1px;padding:2px}

/* ================= 悬浮横幅 ================= */
.heads-up{
  position:absolute;top:48px;left:9px;right:9px;z-index:36;
  display:flex;gap:11px;align-items:flex-start;
  padding:12px 13px;border-radius:20px;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border:1px solid color-mix(in srgb,var(--border) 70%,transparent);
  box-shadow:0 18px 42px -14px rgba(8,12,24,.5);
  animation:hu-in .5s cubic-bezier(.16,.9,.28,1);
  cursor:pointer;
}
@keyframes hu-in{from{transform:translateY(-130%) scale(.94);opacity:0}to{transform:none;opacity:1}}
.heads-up.out{animation:hu-out .32s cubic-bezier(.4,0,1,.6) forwards}
@keyframes hu-out{to{transform:translateY(-130%) scale(.96);opacity:0}}
.heads-up .pn-title{font-size:12.5px}

/* 声音 / 震动的小提示 HUD */
.hud-vol{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:39;
  display:flex;align-items:flex-end;gap:2px;height:16px;
  padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.62);
}
.hud-vol i{width:3px;border-radius:2px;background:#fff;animation:vol .7s infinite alternate}
.hud-vol i:nth-child(1){height:5px;animation-delay:0s}
.hud-vol i:nth-child(2){height:9px;animation-delay:.12s}
.hud-vol i:nth-child(3){height:13px;animation-delay:.24s}
.hud-vol i:nth-child(4){height:8px;animation-delay:.36s}
@keyframes vol{to{transform:scaleY(.45);opacity:.7}}
.hud-vib{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:39;
  display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:600;
}
.hud-vib span{display:inline-block;animation:vib .5s infinite}
@keyframes vib{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}

/* ================= 锁屏 ================= */
.lock{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
  padding:64px 16px 26px;overflow:hidden;
  background:
    radial-gradient(120% 70% at 20% 0%,color-mix(in srgb,var(--primary) 58%,transparent),transparent 62%),
    radial-gradient(110% 80% at 90% 18%,color-mix(in srgb,var(--danger) 34%,transparent),transparent 55%),
    linear-gradient(170deg,#1b2238,#0a0d18 62%,#181026);
  color:#fff;
}
.lock-time{font-size:70px;font-weight:250;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.lock-date{font-size:13px;font-weight:600;opacity:.82;margin-top:5px}
.lock-lock-ic{margin-top:12px;opacity:.75}
.lock-spacer{flex:1}
.lock-note{display:flex;flex-direction:column;gap:9px}
.ln-card{
  display:flex;gap:11px;align-items:flex-start;padding:13px;
  border-radius:20px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 16px 40px -18px rgba(0,0,0,.6);
  animation:lock-in .55s cubic-bezier(.2,.9,.28,1) both;
}
@keyframes lock-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ln-app{
  flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));color:var(--on-primary);
}
.ln-main{flex:1;min-width:0}
.ln-top{font-size:10px;opacity:.72;display:flex;justify-content:space-between;gap:8px}
.ln-title{font-size:12.5px;font-weight:650;margin-top:3px;line-height:1.35}
.ln-body{font-size:11px;opacity:.82;line-height:1.5;margin-top:2px;white-space:pre-line}
.ln-hidden{display:flex;align-items:center;gap:8px;font-size:11.5px;opacity:.9;padding:4px 2px}
.lock-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:24px;padding:0 10px}
.lock-round{
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;color:#fff;opacity:.85;
}

/* ================= 应用内：通知收件箱 ================= */
.nhead{display:flex;align-items:center;gap:11px;padding:12px 16px 0}
.nback{
  width:34px;height:34px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface);display:grid;place-items:center;color:var(--text-2);flex:none;
}
.nhead-main{flex:1;min-width:0}
.nhead h2{font-size:18px;letter-spacing:-.02em;line-height:1.25}
.nhead-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.nall{font-size:11.5px;font-weight:650;color:var(--primary);flex:none}
.chips{display:flex;gap:7px;padding:12px 16px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);color:var(--text-2);
}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip em{font-style:normal;opacity:.75;font-weight:600}
.nlist{display:flex;flex-direction:column;gap:9px;padding:2px 16px 20px}
.n-item{
  display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);position:relative;
  transition:background-color .2s,border-color .2s,opacity .2s;
}
.n-item.unread{
  background:var(--surface);
  background:color-mix(in srgb,var(--primary) 7%,var(--surface));
  border-color:color-mix(in srgb,var(--primary) 22%,var(--border));
}
.n-ic{
  flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
}
.n-ic.warn{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.n-ic.ok{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)}
.n-ic.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.n-ic.info{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.n-main{flex:1;min-width:0}
.n-top{display:flex;align-items:center;gap:6px}
.n-title{font-size:12.5px;font-weight:700;line-height:1.35;letter-spacing:-.01em;flex:1}
.n-body{font-size:11.5px;color:var(--text-2);line-height:1.5;margin-top:3px}
.n-time{font-size:10px;color:var(--text-3);margin-top:6px}
.n-new{font-size:9px;font-weight:750;padding:2px 6px;border-radius:999px;background:var(--danger);color:var(--on-danger);flex:none}
.n-empty{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding:56px 20px;text-align:center;color:var(--text-3);
}
.n-empty-ic{
  width:64px;height:64px;border-radius:22px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--border);color:var(--text-3);
}
.n-empty b{font-size:13.5px;color:var(--text-2)}
.n-empty p{font-size:11.5px;line-height:1.55;max-width:220px}

/* 内联提示条 */
.inline-bar{
  display:flex;gap:9px;align-items:flex-start;
  padding:11px 12px;border-radius:12px;font-size:11.5px;line-height:1.5;
  border:1px solid transparent;color:var(--text-2);
}
.inline-bar svg{flex:none;margin-top:1px}
.inline-bar.warn{
  background:color-mix(in srgb,var(--warning) 13%,transparent);
  border-color:color-mix(in srgb,var(--warning) 42%,transparent);
}
.inline-bar.warn svg{color:var(--warning)}
.inline-bar.bad{
  background:color-mix(in srgb,var(--danger) 11%,transparent);
  border-color:color-mix(in srgb,var(--danger) 36%,transparent);
}
.inline-bar.bad svg{color:var(--danger)}
.inline-bar.info{
  background:color-mix(in srgb,var(--primary) 10%,transparent);
  border-color:color-mix(in srgb,var(--primary) 28%,transparent);
}
.inline-bar.info svg{color:var(--primary)}
.inline-bar b{color:var(--text);font-weight:650}
.inline-wrap{padding:0 16px}

/* 首页「需要我处理」卡 */
.handle-card{
  display:flex;align-items:flex-start;gap:11px;position:relative;
  background:var(--surface);border:1px solid color-mix(in srgb,var(--warning) 34%,var(--border));
  border-radius:16px;padding:14px;box-shadow:var(--shadow-1);
}
.handle-ic{
  flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning);
}
.handle-t{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.handle-b{font-size:11.5px;color:var(--text-2);line-height:1.5;margin-top:3px}
.handle-link{font-size:11.5px;font-weight:700;color:var(--primary);margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.soft-card{background:var(--surface-soft);border:1px dashed var(--border);border-radius:14px;padding:11px 12px;font-size:11px;color:var(--text-3);line-height:1.5}

/* ================= SnackBar ================= */
.snack{
  position:absolute;left:15px;right:15px;bottom:98px;z-index:38;
  display:flex;align-items:center;gap:10px;
  padding:12px 15px;border-radius:12px;
  background:var(--snack-bg);color:#fff;
  font-size:12.5px;line-height:1.45;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.55);
  animation:snack-in .32s cubic-bezier(.2,.9,.3,1);
}
@keyframes snack-in{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.snack.err{background:var(--danger);color:var(--on-danger)}
.snack svg{flex:none;opacity:.9}
.snack-text{flex:1}
.snack-act{font-size:11.5px;font-weight:700;color:#fff;opacity:.9;flex:none}

/* ================= AlertDialog ================= */
.dialog-layer{
  position:absolute;inset:44px 0 0 0;z-index:37;padding:20px;
  display:grid;place-items:center;
  background:rgba(6,9,18,.45);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fade .22s ease;
  overflow-y:auto;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{
  width:100%;max-width:300px;background:var(--surface);border-radius:24px;
  padding:20px;box-shadow:0 30px 70px -22px rgba(0,0,0,.65);
  animation:dlg-in .36s cubic-bezier(.18,.9,.3,1);
}
@keyframes dlg-in{from{transform:scale(.88) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dialog h3{font-size:17px;letter-spacing:-.02em;line-height:1.3}
.dialog .d-sub{font-size:11.5px;color:var(--text-2);line-height:1.6;margin-top:8px}
.dialog .d-ver{
  display:inline-flex;align-items:center;gap:6px;margin-top:6px;
  font-size:10.5px;font-weight:700;color:var(--primary);
  background:color-mix(in srgb,var(--primary) 11%,transparent);
  padding:4px 9px;border-radius:999px;
}
.d-log{
  margin-top:12px;background:var(--surface-soft);border:1px solid var(--border);
  border-radius:12px;padding:10px 12px;max-height:118px;overflow-y:auto;
  font-size:11px;color:var(--text-2);line-height:1.75;scrollbar-width:thin;
}
.d-log b{display:block;color:var(--text);font-size:10.5px;letter-spacing:.04em;margin-bottom:2px}
.d-log li{margin-left:14px}
.d-log p{margin:0}
.dialog-actions{display:flex;gap:9px;margin-top:16px}
.btn{
  flex:1;height:41px;border-radius:12px;display:grid;place-items:center;
  font-size:13px;font-weight:650;transition:.15s;
}
.btn-ghost{background:var(--surface-soft);border:1px solid var(--border);color:var(--text-2)}
.btn-ghost:hover{color:var(--text)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-danger{background:var(--danger);color:var(--on-danger)}

/* ================= 全屏庆祝 ================= */
.burst-layer{
  position:absolute;inset:0;z-index:44;display:grid;place-items:center;
  background:color-mix(in srgb,var(--bg) 58%,transparent);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
.burst-center{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px}
.burst-ring{
  position:absolute;top:50%;left:50%;width:104px;height:104px;margin:-52px 0 0 -52px;
  border-radius:50%;border:2px solid var(--success);
  animation:ring 1.6s cubic-bezier(.2,.6,.3,1) infinite;
}
.burst-ring:nth-child(2){animation-delay:.45s}
@keyframes ring{0%{transform:scale(.7);opacity:.9}80%{transform:scale(2.1);opacity:0}100%{opacity:0}}
.burst-check{
  width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:var(--success);color:var(--on-success);
  box-shadow:0 0 0 10px color-mix(in srgb,var(--success) 16%,transparent),0 22px 45px -12px color-mix(in srgb,var(--success) 65%,transparent);
  animation:check-pop .7s cubic-bezier(.16,1.5,.4,1);
}
@keyframes check-pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.burst-title{font-size:17px;font-weight:750;letter-spacing:-.01em;color:var(--text);animation:txt-in .5s .18s both}
.burst-sub{font-size:12px;color:var(--text-2);animation:txt-in .5s .28s both}
@keyframes txt-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.particle{
  position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
  background:var(--warning);opacity:0;animation:particle 1.5s .1s ease-out forwards;
}
@keyframes particle{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(180deg)}
}

/* ================= 浏览器推送 ================= */
.browser{
  position:absolute;inset:44px 0 0 0;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
}
.browser-bar{
  display:flex;align-items:center;gap:7px;padding:9px 12px;
  background:var(--surface);border-bottom:1px solid var(--border);flex:none;
}
.browser-url{
  flex:1;height:30px;border-radius:999px;background:var(--surface-soft);border:1px solid var(--border);
  display:flex;align-items:center;gap:6px;padding:0 11px;font-size:11px;color:var(--text-2);min-width:0;
}
.browser-url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.browser-page{flex:1;overflow-y:auto;padding:16px}
.b-app-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow-1)}
.b-app-logo{
  width:52px;height:52px;border-radius:16px;margin:0 auto 9px;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));color:var(--on-primary);
  display:grid;place-items:center;font-size:20px;font-weight:800;
  box-shadow:0 10px 22px -10px color-mix(in srgb,var(--primary) 70%,transparent);
}
.b-app-card h4{font-size:14px;margin:0}
.b-app-card p{font-size:11px;color:var(--text-3);line-height:1.55;margin-top:5px}
.b-app-btn{
  margin-top:11px;height:34px;border-radius:11px;background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;font-size:12px;font-weight:650;
}
.b-list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.b-row{height:12px;border-radius:6px;background:var(--surface-soft);border:1px solid var(--border)}
.b-row.s{width:62%}

.web-notif{
  position:absolute;top:8px;left:9px;right:9px;z-index:38;
  display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:0 22px 44px -16px rgba(8,12,24,.5);
  animation:web-in .5s cubic-bezier(.16,.9,.28,1);
}
@keyframes web-in{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.web-notif .wn-ic{
  flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));color:var(--on-primary);
}
.web-notif .wn-dom{font-size:10px;color:var(--text-3)}
.web-notif .wn-title{font-size:12px;font-weight:700;margin-top:2px}
.web-notif .wn-body{font-size:11px;color:var(--text-2);line-height:1.45;margin-top:2px}
.web-notif .wn-x{color:var(--text-3);flex:none}
.ios-home{
  position:absolute;inset:0;background:linear-gradient(165deg,#2b3a5c,#111726 55%,#2d1a2c);
  z-index:6;padding:58px 16px 24px;display:flex;flex-direction:column;color:#fff;
}
.ios-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 12px;margin-top:12px}
.ios-app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9.5px;opacity:.95}
.ios-app i{
  width:50px;height:50px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));color:var(--on-primary);
  font-style:normal;font-weight:800;font-size:17px;box-shadow:0 10px 20px -10px rgba(0,0,0,.6);
}
.ios-app.ph i{background:rgba(255,255,255,.13);border:1px dashed rgba(255,255,255,.25)}
.ios-dock{
  margin-top:auto;display:flex;justify-content:space-around;align-items:center;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.16);
  border-radius:26px;padding:10px;backdrop-filter:blur(14px);
}
.ios-dock i{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16)}

/* ================= 权限弹窗 / 系统设置 ================= */
.syslayer{
  position:absolute;inset:0;z-index:46;display:grid;place-items:center;padding:20px;
  background:rgba(4,6,12,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fade .22s;
}
.sys-dialog{
  width:100%;max-width:292px;border-radius:26px;padding:22px 20px 12px;
  background:var(--surface);box-shadow:0 30px 60px -18px rgba(0,0,0,.6);
  animation:dlg-in .34s cubic-bezier(.18,.9,.3,1);
}
.sys-dialog .sys-app{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.sys-dialog .sys-app i{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--primary),var(--primary-soft));color:var(--on-primary);font-style:normal;font-weight:800;
}
.sys-dialog .sys-app b{font-size:12.5px}
.sys-dialog h3{font-size:16px;line-height:1.35;letter-spacing:-.02em}
.sys-dialog p{font-size:11.5px;color:var(--text-2);line-height:1.6;margin-top:7px}
.sys-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.sys-actions button{font-size:13px;font-weight:650;color:var(--primary);padding:8px 12px;border-radius:10px}
.sys-actions button:hover{background:color-mix(in srgb,var(--primary) 9%,transparent)}
.sys-settings{
  position:absolute;inset:44px 0 0 0;background:var(--bg);z-index:8;display:flex;flex-direction:column;
}
.sys-bar{
  display:flex;align-items:center;gap:10px;padding:12px 15px;
  background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;font-weight:650;flex:none;
}
.sys-bar .back{color:var(--text-2);display:flex}
.sys-row{
  display:flex;align-items:center;gap:12px;padding:15px 16px;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.sys-row .sr-ic{color:var(--text-2);flex:none}
.sys-row .sr-main{flex:1;min-width:0}
.sys-row b{font-size:12.5px;font-weight:600;display:block}
.sys-row p{font-size:10.5px;color:var(--text-3);margin-top:2px;line-height:1.5}
.toggle{width:40px;height:23px;border-radius:999px;background:var(--border);position:relative;flex:none;transition:.2s}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.toggle.on{background:var(--primary)}
.toggle.on:after{transform:translateX(17px)}

/* ================= 右侧详情 ================= */
.detail{position:sticky;top:72px;display:flex;flex-direction:column;gap:12px}
.detail-card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:18px;box-shadow:var(--shadow-1);
}
.detail-tag{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:750;letter-spacing:.1em;color:var(--text-3);text-transform:uppercase}
.detail-tag i{width:5px;height:5px;border-radius:50%;background:var(--primary)}
.detail-card h2{font-size:18px;letter-spacing:-.02em;line-height:1.3;margin:7px 0 0}
.detail-lead{font-size:12px;color:var(--text-2);line-height:1.6;margin-top:8px}
.detail-meta{margin-top:14px;display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--border);padding-top:13px}
.dm{display:flex;gap:9px;align-items:flex-start}
.dm-ic{flex:none;color:var(--text-3);margin-top:1px}
.dm-t{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text-3);text-transform:uppercase}
.dm-p{font-size:11.5px;color:var(--text-2);line-height:1.55;margin-top:2px}
.dm-p.good{color:var(--text-2)}
.pick-btn{
  width:100%;margin-top:15px;height:44px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  font-size:13.5px;font-weight:700;
  background:var(--primary);color:var(--on-primary);
  box-shadow:0 12px 22px -12px color-mix(in srgb,var(--primary) 80%,transparent);
  transition:.16s;
}
.pick-btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.pick-btn.picked{
  background:color-mix(in srgb,var(--success) 15%,transparent);
  color:var(--success);
  border:1px solid color-mix(in srgb,var(--success) 40%,transparent);
  box-shadow:none;
}
.detail-note{
  font-size:10.5px;color:var(--text-3);line-height:1.6;padding:0 3px;
}
.detail-note b{color:var(--text-2)}

/* ================= 选择条 ================= */
.choicebar{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:75;
  display:flex;align-items:center;gap:14px;
  padding:9px 10px 9px 18px;border-radius:999px;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:0 22px 50px -22px rgba(8,12,24,.5);
  max-width:calc(100vw - 32px);
  transition:box-shadow .2s,transform .2s;
}
.choicebar .cb-text{font-size:12.5px;color:var(--text-2);white-space:nowrap}
.choicebar .cb-text b{color:var(--text)}
.cb-dots{display:flex;gap:-6px}
.cb-dot{
  width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  font-size:9.5px;font-weight:800;color:var(--on-primary);
  background:var(--primary);border:2px solid var(--surface);margin-left:-7px;
  font-variant-numeric:tabular-nums;
}
.cb-dot:first-child{margin-left:0}
.cb-go{
  height:36px;padding:0 16px;border-radius:999px;background:var(--primary);
  color:var(--on-primary);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.cb-go:hover{filter:brightness(1.07)}
.cb-clear{font-size:11px;color:var(--text-3);padding:0 6px}
.cb-clear:hover{color:var(--danger)}

/* 页面 toast */
.page-toast{
  position:fixed;left:50%;bottom:86px;transform:translate(-50%,10px);z-index:90;
  background:#28282e;color:#fff;font-size:12px;font-weight:600;
  padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;box-shadow:0 16px 30px -14px rgba(0,0,0,.6);
}
.page-toast.show{opacity:1;transform:translate(-50%,0)}

/* ================= 一览对比 ================= */
.grid-view{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
.g-card{
  text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:18px;
  padding:15px;box-shadow:var(--shadow-1);transition:.18s;position:relative;display:flex;flex-direction:column;gap:11px;
}
.g-card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--primary) 38%,var(--border));box-shadow:0 18px 40px -22px rgba(8,12,24,.4)}
.g-card.picked{border-color:color-mix(in srgb,var(--success) 55%,var(--border))}
.g-top{display:flex;align-items:center;gap:8px}
.g-num{font-size:10px;font-weight:800;color:var(--text-3);width:20px;height:20px;border-radius:6px;background:var(--surface-soft);display:grid;place-items:center;flex:none}
.g-name{font-size:13.5px;font-weight:700;line-height:1.3;flex:1}
.g-picked-flag{color:var(--success);display:none}
.g-card.picked .g-picked-flag{display:block}
.g-mini{
  height:96px;border-radius:12px;border:1px solid var(--border);
  background:
    radial-gradient(90% 80% at 100% 0%,color-mix(in srgb,var(--primary) 13%,transparent),transparent 60%),
    var(--surface-soft);
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.g-desc{font-size:11px;color:var(--text-3);line-height:1.5}
.g-pick{
  position:absolute;right:11px;bottom:11px;height:26px;padding:0 10px;border-radius:8px;
  font-size:10.5px;font-weight:700;background:var(--surface);border:1px solid var(--border);color:var(--text-2);
  display:none;
}
.g-card:hover .g-pick{display:flex;align-items:center}
@media (hover:none){.g-pick{display:flex;align-items:center}}
.g-card.picked .g-pick{display:flex;align-items:center;background:var(--success);color:var(--on-success);border-color:var(--success)}

/* mini 示意图元素 */
.mi{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.mi-notif{width:132px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:5px}
.mi-row{display:flex;align-items:center;gap:5px}
.mi-sq{width:16px;height:16px;border-radius:5px;background:linear-gradient(140deg,var(--primary),var(--primary-soft));flex:none}
.mi-line{height:5px;border-radius:3px;background:var(--border);flex:1}
.mi-line.w40{flex:none;width:40%}
.mi-line.w70{flex:none;width:70%}
.mi-line.w55{flex:none;width:55%}
.mi-line.w85{flex:none;width:85%}
.mi-banner{position:absolute;top:8px;left:10px;right:10px;height:34px;border-radius:9px;background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 14px -8px rgba(0,0,0,.4);display:flex;align-items:center;gap:6px;padding:0 8px}
.mi-lock{width:120px;height:74px;border-radius:12px;background:linear-gradient(160deg,#2b3a5c,#141a2a);padding:10px;display:flex;flex-direction:column;justify-content:space-between}
.mi-lock span{font-size:18px;font-weight:300;color:#fff;letter-spacing:-.03em}
.mi-lock b{height:16px;border-radius:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.18);display:block}
.mi-lock em{font-style:normal;height:5px;border-radius:3px;background:rgba(255,255,255,.45);display:block;width:60%}
.mi-push{width:120px;height:74px;border-radius:12px;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden}
.mi-push .bar{position:absolute;top:0;left:0;right:0;height:18px;background:var(--surface-soft);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 6px;gap:4px}
.mi-push .dot{width:5px;height:5px;border-radius:50%;background:var(--border)}
.mi-push .url{flex:1;height:7px;border-radius:3px;background:var(--border)}
.mi-push .card{position:absolute;top:26px;left:10px;right:10px;bottom:10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:0 6px 12px -8px rgba(0,0,0,.4);display:flex;gap:5px;padding:6px}
.mi-inbox{width:126px;display:flex;flex-direction:column;gap:4px}
.mi-inbox i{height:19px;border-radius:6px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;gap:4px;padding:0 5px}
.mi-inbox i.unread{background:color-mix(in srgb,var(--primary) 10%,var(--surface));border-color:color-mix(in srgb,var(--primary) 28%,var(--border))}
.mi-inbox i b{width:9px;height:9px;border-radius:3px;background:var(--primary);flex:none}
.mi-inbox i s{text-decoration:none;height:4px;flex:1;border-radius:2px;background:var(--border)}
.mi-nav{width:140px;height:34px;border-radius:999px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;box-shadow:var(--shadow-1);padding:0 4px}
.mi-nav span{display:flex;flex-direction:column;align-items:center;gap:2px}
.mi-nav i{width:10px;height:10px;border-radius:3px;background:var(--border)}
.mi-nav span.on i{background:var(--primary)}
.mi-nav .bdg{position:relative}
.mi-nav .bdg:after{content:"3";position:absolute;top:-6px;right:-7px;width:12px;height:12px;border-radius:50%;background:var(--danger);color:#fff;font-size:7px;font-weight:800;display:grid;place-items:center}
.mi-card{width:130px;border-radius:10px;background:var(--surface);border:1px solid color-mix(in srgb,var(--warning) 40%,var(--border));padding:8px;display:flex;flex-direction:column;gap:5px}
.mi-card .h{display:flex;align-items:center;gap:5px}
.mi-card .pulse{width:6px;height:6px}
.mi-snack{position:absolute;left:12px;right:12px;bottom:14px;height:28px;border-radius:8px;background:#303030;display:flex;align-items:center;gap:6px;padding:0 8px}
.mi-snack i{width:8px;height:8px;border-radius:50%;background:#6ee7a0;flex:none}
.mi-snack b{height:4px;flex:1;border-radius:2px;background:rgba(255,255,255,.4)}
.mi-dialog{width:112px;padding:9px;border-radius:11px;background:var(--surface);border:1px solid var(--border);box-shadow:0 10px 22px -10px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:5px}
.mi-dialog b{height:6px;width:60%;border-radius:3px;background:var(--text-2);opacity:.7}
.mi-dialog i{height:4px;border-radius:2px;background:var(--border)}
.mi-dialog .btns{display:flex;gap:5px;margin-top:3px}
.mi-dialog .btns u{flex:1;height:12px;border-radius:4px;background:var(--surface-soft);border:1px solid var(--border);text-decoration:none}
.mi-dialog .btns u.p{background:var(--primary);border-color:var(--primary)}
.mi-burst{position:relative;width:54px;height:54px;border-radius:50%;background:var(--success);display:grid;place-items:center;box-shadow:0 0 0 7px color-mix(in srgb,var(--success) 15%,transparent)}
.mi-burst:before,.mi-burst:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1.5px solid var(--success);opacity:.5}
.mi-burst:after{inset:-16px;opacity:.25}
.mi-inline{width:136px;display:flex;flex-direction:column;gap:5px}
.mi-inline i{height:9px;border-radius:3px;background:var(--border)}
.mi-inline .warn{height:28px;border-radius:7px;background:color-mix(in srgb,var(--warning) 15%,transparent);border:1px solid color-mix(in srgb,var(--warning) 45%,transparent);display:flex;align-items:center;gap:5px;padding:0 6px}
.mi-inline .warn b{width:8px;height:8px;border-radius:50%;background:var(--warning);flex:none}
.mi-inline .warn s{text-decoration:none;height:4px;flex:1;border-radius:2px;background:color-mix(in srgb,var(--warning) 55%,transparent)}
.mi-perm{width:112px;border-radius:12px;background:var(--surface);border:1px solid var(--border);padding:10px;box-shadow:0 10px 22px -10px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:6px}
.mi-perm i{width:22px;height:22px;border-radius:7px;background:linear-gradient(140deg,var(--primary),var(--primary-soft))}
.mi-perm b{height:4px;width:70%;border-radius:2px;background:var(--text-3);opacity:.55}
.mi-perm s{height:3px;width:80%;border-radius:2px;background:var(--border);text-decoration:none}

/* ================= 我的选择 ================= */
.picked-view{grid-column:1/-1;max-width:920px;margin:0 auto;width:100%}
.picked-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.picked-head h2{font-size:22px;letter-spacing:-.02em}
.picked-head p{font-size:12px;color:var(--text-3);margin-top:5px}
.picked-list{display:flex;flex-direction:column;gap:10px}
.picked-row{
  display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-1);
}
.picked-row .pr-num{
  width:26px;height:26px;border-radius:8px;background:color-mix(in srgb,var(--success) 15%,transparent);
  color:var(--success);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;
}
.picked-row .pr-main{flex:1;min-width:0}
.picked-row .pr-name{font-size:13.5px;font-weight:700}
.picked-row .pr-desc{font-size:11.5px;color:var(--text-3);line-height:1.5;margin-top:2px}
.picked-row .pr-actions{display:flex;gap:6px;flex:none}
.pr-small{
  height:30px;padding:0 10px;border-radius:9px;font-size:11px;font-weight:650;
  background:var(--surface-soft);border:1px solid var(--border);color:var(--text-2);
}
.pr-small:hover{color:var(--text)}
.picked-empty{
  padding:56px 20px;border-radius:20px;border:1px dashed var(--border);background:var(--surface-soft);
  text-align:center;color:var(--text-3);
}
.picked-empty b{display:block;font-size:15px;color:var(--text-2);margin-bottom:6px}
.picked-empty p{font-size:12px;line-height:1.6}
.picked-summary{
  margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px;box-shadow:var(--shadow-1);
}
.picked-summary h3{font-size:13px;letter-spacing:.02em;margin-bottom:9px}
.picked-summary pre{
  margin:0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px;line-height:1.7;color:var(--text-2);
  background:var(--surface-soft);border:1px solid var(--border);border-radius:12px;padding:13px;
  max-height:280px;overflow:auto;
}
.sum-actions{display:flex;gap:8px;margin-top:12px}

/* ================= 响应式 ================= */
@media (max-width:1240px){
  .layout{grid-template-columns:232px minmax(340px,1fr) 300px;gap:18px;padding:16px 16px 130px}
  .detail-card{padding:16px}
}
@media (max-width:1080px){
  .layout{display:flex;flex-direction:column;max-width:780px;padding:14px 16px 120px;gap:14px}
  .hero{order:0;flex-direction:column;align-items:flex-start;gap:12px;padding:2px 2px 0}
  .hero p{max-width:none}
  .hero-stat{width:100%}
  .hero-stat div{flex:1}
  .rail{order:1;position:static;flex-direction:row;gap:8px;overflow-x:auto;overflow-y:hidden;max-height:none;padding:2px 2px 8px}
  .rail-group{display:none}
  .rail-item{flex:none;width:auto;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-color:var(--border)}
  .rail-desc,.rail-pick{display:none}
  .rail-num{width:20px;height:20px;margin-top:0}
  .stage{order:2;width:100%}
  .detail{order:3;position:static;width:100%;max-width:640px;margin:0 auto}
  #gridView,#pickedView{order:2;width:100%}
  .choicebar{bottom:12px;max-width:calc(100vw - 24px)}
  .stage-head{flex-wrap:wrap;row-gap:8px}
  .topbar{flex-wrap:wrap;gap:10px;padding:10px 16px}
  .brand{flex:1}
  .views{order:3;width:100%;justify-content:space-between;padding:3px}
  .views button{flex:1;justify-content:center;white-space:nowrap}
  .themes{margin-left:0}
  .stage{order:2;width:100%}
}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;gap:9px;padding:10px 14px}
  .brand{flex:1}
  .brand-txt span{display:none}
  .views{order:3;width:100%;justify-content:space-between;padding:3px}
  .views button{flex:1;justify-content:center;padding:7px 6px;font-size:12px}
  .themes{margin-left:0;gap:5px}
  .theme-name{display:none}
  .hero h1{font-size:20px}
  .hero p{font-size:12px}
  .hero-stat b{font-size:15px}
  .layout{padding:12px 12px 108px;gap:12px}
  .phone{width:min(300px,calc(100vw - 36px))}
  .choicebar{left:12px;right:12px;bottom:10px;transform:none;justify-content:space-between;max-width:none}
  .detail-card h2{font-size:17px}
  .grid-view{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .views em{display:none}
}
@media (max-width:480px){
  .phone{width:calc(100vw - 32px);border-radius:44px;padding:7px}
  .phone-screen{border-radius:38px}
  .layout{padding:12px 10px 104px}
  .hero h1{font-size:19px}
  .stage-head h1{font-size:17px}
  .views button{padding:6px 4px;font-size:11.5px;gap:4px}
  .grid-view{grid-template-columns:1fr 1fr}
  .choicebar .cb-text{font-size:11.5px}
}
body{overflow-x:hidden}
</style>

const KEY = 'sn-notif-gallery-v1';
let timers = [];

/* ---------------- 小工具 ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const ic = (name, size = 16) => '<svg width="' + size + '" height="' + size + '" style="flex:none" aria-hidden="true"><use href="#i-' + name + '"></use></svg>';
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      theme: state.theme, selected: state.selected,
      msgKind: state.msgKind, style: state.style
    }));
  } catch (e) { /* 隐私模式忽略 */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o.theme && THEMES[o.theme]) state.theme = o.theme;
    if (Array.isArray(o.selected)) state.selected = o.selected.filter(id => DEMOS.some(d => d.id === id));
    if (o.msgKind && MSG[o.msgKind]) state.msgKind = o.msgKind;
    if (o.style && typeof o.style === 'object') Object.assign(state.style, o.style);
  } catch (e) { /* 忽略坏数据 */ }
}

function applyTheme() {
  const t = THEMES[state.theme] || THEMES.original;
  document.documentElement.dataset.theme = state.theme;
  document.documentElement.dataset.dark = t[1] ? '1' : '0';
  $('#themeName').textContent = t[0];
  document.querySelectorAll('.theme-dot').forEach(b => b.classList.toggle('on', b.dataset.theme === state.theme));
}

function pageToast(text) {
  const el = $('#pageToast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 1700);
}

    let badge = '';

function hudVol() {
  return '<div class="hud-vol"><i></i><i></i><i></i><i></i></div>';

function shakePhone() {
  const p = $('#phone');
  if (!p) return;
  p.classList.remove('shake');
  void p.offsetWidth;
  p.classList.add('shake');
  later(() => p.classList.remove('shake'), 760);
}
function reminderFx() {
  const fx = [];
  if (state.style.vibrate) fx.push(() => later(() => { shakePhone(); }, 90));
  if (state.style.sound) fx.push(() => later(() => { const el = $('.hud-vol'); if (el) el.remove(); }, 1150));
  return fx;
}

/* ============================================================
   渲染：手机 / 控件 / 详情
   ============================================================ */
function renderStage() {
  timers.forEach(clearTimeout);
  timers = [];
  const d = DEMOS.find(x => x.id === state.demo) || DEMOS[0];
  $('#stageKicker').textContent = d.kicker;
  $('#stageTitle').textContent = d.name;

  const r = RENDERERS[d.id]() || {};
  const screen = $('#screen');
  screen.innerHTML = r.screen || '';
  screen.scrollTop = 0;
  screen.style.inset = r.cls === 'lockmode' ? '0' : '';
  $('#overlay').innerHTML = r.overlay || '';
  $('#statusbar').classList.toggle('hidden', !!r.hideStatus);
  $('#phone').className = 'phone' + (r.cls ? ' ' + r.cls : '') + (r.hideStatus ? ' lockmode' : '');

  $('#controls').innerHTML = renderControls(d);
  renderDetail(d);
  (r.after || []).forEach(fn => fn());
}

function ctrlSeg(label, opts, key, cur) {
  return '<div class="control"><span class="control-label">' + label + '</span><div class="seg">' +
    opts.map(([v, t]) => '<button class="' + (cur === v ? 'on' : '') + '" data-act="set" data-key="' + key + '" data-val="' + v + '">' + t + '</button>').join('') +
  '</div></div>';
}
function ctrlSwitch(label, key, on) {
  return '<label class="switch"><input type="checkbox" data-act="toggle" data-key="' + key + '" ' + (on ? 'checked' : '') + '><i></i>' + label + '</label>';
}

function renderControls(d) {
  const c = d.controls || [];
  const parts = [];
  if (c.indexOf('kind') >= 0) {
    parts.push(ctrlSeg('消息类型', [['task', '任务提醒'], ['sleep', '睡觉提醒'], ['checkin', '打卡提醒'], ['custom', '自定义']], 'msgKind', state.msgKind));
  }
  if (c.indexOf('style') >= 0) {
    parts.push('<div class="control"><span class="control-label">表现开关</span><div style="display:flex;gap:14px;flex-wrap:wrap;padding-top:2px">' +
      ctrlSwitch('声音', 'sound', state.style.sound) +
      ctrlSwitch('震动', 'vibrate', state.style.vibrate) +
      ctrlSwitch('悬浮横幅', 'headsUp', state.style.headsUp) +
      ctrlSwitch('锁屏显示内容', 'lockscreenVisible', state.style.lockscreenVisible) +
    '</div></div>');
  }
  if (c.indexOf('lockscreen') >= 0) {
    parts.push('<div class="control"><span class="control-label">表现开关</span><div style="display:flex;gap:14px;padding-top:2px">' +
      ctrlSwitch('锁屏显示内容', 'lockscreenVisible', state.style.lockscreenVisible) + '</div></div>');
  }
  if (c.indexOf('device') >= 0) {
    parts.push(ctrlSeg('设备', [['android', '安卓 Chrome'], ['ios', 'iPhone 主屏']], 'pushDevice', state.pushDevice));
  }
  if (c.indexOf('badgeNum') >= 0) {
    parts.push(ctrlSeg('未读数', [['3', '3'], ['12', '12'], ['120', '99+']], 'badgeNum', String(state.badgeNum)));
  }
  if (c.indexOf('role') >= 0) {
    parts.push(ctrlSeg('视角', [['kid', '孩子'], ['parent', '家长']], 'role', state.role));
  }
  if (c.indexOf('snackKind') >= 0) {
    parts.push(ctrlSeg('文案', [['ok', '成功回执'], ['plain', '普通提示'], ['err', '出错']], 'snackKind', state.snackKind));
  }
  if (c.indexOf('dialogKind') >= 0) {
    parts.push(ctrlSeg('弹窗', [['update', '版本更新'], ['confirm', '兑换确认'], ['input', '输入内容']], 'dialogKind', state.dialogKind));
  }
  if (c.indexOf('inlineKind') >= 0) {
    parts.push(ctrlSeg('场景', [['migrate', '服务未就绪'], ['refresh', '刷新失败'], ['permission', '没权限']], 'inlineKind', state.inlineKind));
  }
  if (c.indexOf('permKind') >= 0) {
    parts.push(ctrlSeg('权限', [['notify', '通知权限'], ['exact', '精确闹钟']], 'permKind', state.permKind));
  }
  if (c.indexOf('resetInbox') >= 0) {
    parts.push('<div class="control"><span class="control-label">演示</span><div class="seg"><button data-act="reset-inbox">恢复 3 条未读</button></div></div>');
  }
  if (!parts.length) {
    parts.push('<div class="control"><span class="control-label">演示</span><div class="seg"><button data-act="replay">再播一次</button></div></div>');
  }
  return parts.join('');
}

function metaRow(icon, k, v) {

function renderDetail(d) {

    html += '<div class="picked-list">' + cards.map((d, i) =>
      '<div class="picked-row">' +
        '<span class="pr-num">' + (i + 1) + '</span>' +
        '<div class="pr-main"><div class="pr-name">' + d.name + '</div><div class="pr-desc">' + d.kicker + ' · ' + d.short + '</div></div>' +
        '<div class="pr-actions"><button class="pr-small" data-act="go" data-id="' + d.id + '">看演示</button>' +
          '<button class="pr-small" data-act="pick" data-id="' + d.id + '">移除</button></div>' +
      '</div>').join('') + '</div>';
    html += '<div class="picked-summary"><h3>可复制的选择</h3><pre>' + esc(pickedText(cards)) + '</pre>' +
      '<div class="sum-actions"><button class="pick-btn" style="max-width:200px;margin-top:0;height:38px" data-act="copy-picked">' + ic('copy', 15) + ' 复制清单</button>' +
      '<button class="pr-small" data-act="clear-picked">清空选择</button></div></div>';
  }
  $('#pickedView').innerHTML = html;
}

function renderChoicebar() {
  const n = state.selected.length;
  $('#pickCountText').textContent = n;
  $('#tabPickCount').textContent = n;
  $('#cbDots').innerHTML = state.selected.map(id => {
    const d = DEMOS.find(x => x.id === id);
    return d ? '<span class="cb-dot" title="' + d.name + '">' + d.n + '</span>' : '';
  }).join('');
}

function setView(v) {
  state.view = v;
  document.querySelectorAll('#viewTabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  const gallery = v === 'gallery';
  $('#hero').style.display = gallery ? 'flex' : 'none';
  $('#rail').style.display = gallery ? '' : 'none';
  $('#stage').style.display = gallery ? '' : 'none';
  $('#detail').style.display = gallery ? '' : 'none';
  $('#gridView').style.display = v === 'grid' ? 'grid' : 'none';
  $('#pickedView').style.display = v === 'picked' ? 'block' : 'none';
  if (v === 'grid') renderGrid();
  if (v === 'picked') renderPicked();
}

/* ============================================================
   选择 / 动作
   ============================================================ */
function togglePick(id) {
  const i = state.selected.indexOf(id);
  if (i >= 0) state.selected.splice(i, 1);
  else state.selected.push(id);
  save();
  renderRail();
  renderGrid();
  renderPicked();
  renderChoicebar();
  const d = DEMOS.find(x => x.id === id);
  renderDetail(d);
  if (state.selected.indexOf(id) >= 0) pageToast('已选：' + d.name);
  else pageToast('已移除：' + d.name);
}

async function copyPicked() {
  const cards = state.selected.map(id => DEMOS.find(d => d.id === id)).filter(Boolean);
  const text = pickedText(cards);
  try {
    await navigator.clipboard.writeText(text);
    pageToast('清单已复制');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); pageToast('清单已复制'); }
    catch (e2) { pageToast('复制失败，手动选一下文字吧'); }
    ta.remove();
  }
}

function goDemo(id) {
  state.demo = id;
  setView('gallery');
  renderRail();
  renderStage();
}

/* ============================================================
   事件
   ============================================================ */
document.addEventListener('change', e => {
  const cb = e.target.closest('input[data-act="toggle"]');
  if (!cb) return;
  const key = cb.dataset.key;
  if (key in state.style) {
    state.style[key] = cb.checked;
    save();
    renderStage();
  }
});

document.addEventListener('click', e => {
  /* 主题 */
  const themeBtn = e.target.closest('.theme-dot');
  if (themeBtn) {
    state.theme = themeBtn.dataset.theme;
    applyTheme();
    save();
    return;
  }
  /* 顶部视图 */
  const viewBtn = e.target.closest('#viewTabs button');
  if (viewBtn) { setView(viewBtn.dataset.view); return; }

  /* 首页铃铛 / 处理卡入口 → 跳通知收件箱演示 */
  if (e.target.closest('.s-bell') || e.target.closest('.handle-link')) {
    goDemo('inbox');
    return;
  }

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'go') { goDemo(el.dataset.id); return; }

  if (act === 'pick') { togglePick(el.dataset.id); return; }

  if (act === 'replay') { renderStage(); return; }

  if (act === 'panel-close') {
    const p = el.closest('.notif-panel');
    if (p) p.remove();
    return;
  }
  if (act === 'open-app') {
    const p = el.closest('.notif-panel');
    if (p) p.remove();
    pageToast('（示意）打开 SekaiNook 的通知页');
    return;
  }
  if (act === 'web-ok') {
    const w = el.closest('.web-notif');
    if (w) w.remove();
    return;
  }

  /* 演示控件 */
  if (act === 'set') {
    const key = el.dataset.key;
    let val = el.dataset.val;
    if (key === 'badgeNum') val = Number(val);
    state[key] = val;
    save();
    renderStage();
    return;
  }

  /* 收件箱交互 */
  if (act === 'filter') {
    state.inboxFilter = el.dataset.f;
    renderStage();
    return;
  }
  if (act === 'readall') {
    state.readIds = NOTIFS.map(n => n.id);
    state.flashSnack = true;
    renderStage();
    return;
  }
  if (act === 'read') {
    const id = Number(el.dataset.id);
    if (state.readIds.indexOf(id) < 0) {
      state.readIds.push(id);
      renderStage();
    }
    return;
  }
  if (act === 'reset-inbox') {
    state.readIds = [];
    state.inboxFilter = 'all';
    renderStage();
    return;
  }

  /* 手机内浮层 */
  if (act === 'snack-close') {
    const s = el.closest('.snack');
    if (s) s.remove();
    return;
  }
  if (act === 'dialog-close') {
    const d = el.closest('.dialog-layer');
    if (d) d.remove();
    return;
  }
  if (act === 'perm-allow' || act === 'perm-deny') {
    const l = el.closest('.syslayer');
    if (l) l.remove();
    pageToast(act === 'perm-allow' ? '（示意）已允许，回去就能开提醒了' : '（示意）没通知权限，到点就不会响');
    return;
  }

  /* 选择条 */
  if (act === 'copy-picked') { copyPicked(); return; }
  if (act === 'clear-picked') {
    state.selected = [];
    save();
    renderRail(); renderGrid(); renderPicked(); renderChoicebar(); renderDetail(DEMOS.find(d => d.id === state.demo));
    pageToast('已清空选择');
    return;
  }
});

$('#cbGo').addEventListener('click', () => setView('picked'));
$('#cbClear').addEventListener('click', () => {
  if (!state.selected.length) { pageToast('还没选呢'); return; }
  state.selected = [];
  save();
  renderRail(); renderGrid(); renderPicked(); renderChoicebar();
  renderDetail(DEMOS.find(d => d.id === state.demo));
  pageToast('已清空选择');
});
$('#replayBtn').addEventListener('click', () => renderStage());

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (state.view !== 'gallery') return;
  const i = DEMOS.findIndex(d => d.id === state.demo);
  const next = (i + (e.key === 'ArrowRight' ? 1 : -1) + DEMOS.length) % DEMOS.length;
  goDemo(DEMOS[next].id);
});

/* ============================================================
   启动
   ============================================================ */
load();
applyTheme();
renderRail();
setView('gallery');
renderStage();
renderChoicebar();
renderGrid();
renderPicked();
/* 支持 ?demo=xx&view=grid&theme=sakura 直达，方便分享某个通知方式 */
(function () {
  try {
    const q = new URLSearchParams(location.search);
    const th = q.get('theme');
    if (th && THEMES[th]) { state.theme = th; applyTheme(); }
    const demo = q.get('demo');
    if (demo && DEMOS.some(d => d.id === demo)) { state.demo = demo; renderRail(); renderStage(); }
    const picks = q.get('picked');
    if (picks) {
      picks.split(',').forEach(function (id) {
        if (DEMOS.some(d => d.id === id) && state.selected.indexOf(id) < 0) state.selected.push(id);
      });
      save();
      renderRail(); renderChoicebar(); renderGrid(); renderPicked();
    }
    const v = q.get('view');
    if (v === 'grid' || v === 'picked') setView(v);
    const h = (location.hash || '').replace('#', '');
    if (h === 'grid' || h === 'picked') setView(h);
  } catch (err) { /* 参数坏了就当没有 */ }
})();
</script>
</body>
</html>

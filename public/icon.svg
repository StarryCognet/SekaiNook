<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SekaiNook">
  <title>SekaiNook</title>
  <defs>
    <linearGradient id="sn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A2E" />
      <stop offset="1" stop-color="#101020" />
    </linearGradient>
    <linearGradient id="sn-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166" />
      <stop offset="1" stop-color="#F0A43B" />
    </linearGradient>
  </defs>

  <!-- 深蓝圆角方块底 -->
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#sn-bg)" stroke="#33335C" stroke-width="4" />

  <!-- 太阳光芒（8 道，圆头） -->
  <g stroke="#FFD166" stroke-width="24" stroke-linecap="round">
    <line x1="256" y1="116" x2="256" y2="86" />
    <line x1="312.6" y1="139.4" x2="333.8" y2="118.2" />
    <line x1="336" y1="196" x2="366" y2="196" />
    <line x1="312.6" y1="252.6" x2="333.8" y2="273.8" />
    <line x1="256" y1="276" x2="256" y2="306" />
    <line x1="199.4" y1="252.6" x2="178.2" y2="273.8" />
    <line x1="176" y1="196" x2="146" y2="196" />
    <line x1="199.4" y1="139.4" x2="178.2" y2="118.2" />
  </g>

  <!-- 太阳本体 -->
  <circle cx="256" cy="196" r="56" fill="url(#sn-sun)" />

  <!-- SN 字样 -->
  <text x="256" y="385" text-anchor="middle" dominant-baseline="central"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="168" font-weight="700" fill="#FFFFFF">SN</text>
</svg>
